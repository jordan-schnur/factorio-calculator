name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # The site only goes out when the end-to-end suite passes.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      # The calculator is the site root; calc-redirect.html takes calc.html's old name so /calc.html#... links still open; the licence files ship alongside.
      - name: Lay out the site
        run: |
          mv dist/calc.html dist/index.html
          mv dist/calc-redirect.html dist/calc.html
          cp LICENSE NOTICE-factorio-companion.md dist/

      # cname rewrites CNAME on every deploy, or each push would drop the custom domain.
      - name: Deploy to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: factoriocalculator.app
