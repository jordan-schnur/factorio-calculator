<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Keep the title in step with settings.js's INTRO_TITLE. -->
    <title>Factorio Calculator – Space Age &amp; 2.0 Production Ratios</title>
    <meta name="description" content="Free Factorio calculator for 2.0 and Space Age. Pick an item and a rate to get every machine, belt and raw input, as a table or a flow graph.">
    <link rel="canonical" href="https://factoriocalculator.app/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Factorio Calculator">
    <meta property="og:title" content="Factorio Calculator – Space Age &amp; 2.0 Production Ratios">
    <meta property="og:description" content="Pick an item and a rate; see every machine, belt and raw input as a table or a flow graph. Factorio 2.0 and Space Age supported.">
    <meta property="og:url" content="https://factoriocalculator.app/">
    <meta property="og:image" content="https://factoriocalculator.app/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The calculator's flow graph for a Factorio science pack build">
    <meta name="twitter:card" content="summary_large_image">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Factorio Calculator",
        "url": "https://factoriocalculator.app/",
        "description": "Production calculator for Factorio 2.0 and Space Age: machines, belts and raw inputs for any item and rate, as a table or a flow graph.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Jordan Schnur" },
        "isBasedOn": "https://kirkmcdonald.github.io/calc.html"
    }
    </script>
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap">
    <!-- A module that fails to load (often a stale cached copy after an update) leaves a dead page, so say so. -->
    <script>
        window.addEventListener("error", function (e) {
            var msg = String(e.message || "")
            if (!/module|export|import/i.test(msg)) return
            var bar = document.getElementById("stale-banner") || document.createElement("div")
            bar.id = "stale-banner"
            bar.textContent = "The calculator did not load (" + msg + "). Press Ctrl+F5 to reload it fresh."
            bar.style.cssText = "position: fixed; left: 0; right: 0; top: 0; z-index: 1000; background: #c43e3e; color: #fff; font: 700 14px sans-serif; padding: 10px 16px;"
            ;(document.body || document.documentElement).appendChild(bar)
        })
    </script>
    <script type="module" src="/src/main.js"></script>
</head>

<!-- The solver and data model are Kirk McDonald's (Apache-2.0, see LICENSE and NOTICE-factorio-companion.md). -->
<body>
<div id="app"><!--app--></div>
</body>
</html>
